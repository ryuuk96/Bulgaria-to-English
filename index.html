<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1117">
<title>Sofia Ready — Learn Bulgarian</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #181b26;
  --card: #1e2235;
  --border: #2a2f4a;
  --accent: #4f8cff;
  --accent2: #7c4fff;
  --green: #22c55e;
  --red: #ef4444;
  --amber: #f59e0b;
  --ph-color: #fb923c;
  --text: #eaecf8;
  --text2: #9ba3c9;
  --text3: #5a6390;
  --radius: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;font-size:16px}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* ── Screens ── */
#app{min-height:100vh;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;min-height:100vh}
.screen.active{display:flex}

/* ── Nav ── */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:100;min-height:54px
}
.nav-title{font-size:1rem;font-weight:700;color:var(--text);flex:1;text-align:center;padding:0 8px}
.nav-back{
  background:none;border:none;color:var(--accent);font-size:1rem;
  cursor:pointer;padding:8px 12px;border-radius:10px;min-width:48px;min-height:48px;
  display:flex;align-items:center;justify-content:center
}
.nav-back:active{background:rgba(79,140,255,.15)}
.nav-spacer{min-width:60px}

/* ── Home ── */
.home-header{
  background:linear-gradient(160deg,#181b26 0%,#12162a 100%);
  padding:40px 20px 32px;text-align:center;border-bottom:1px solid var(--border)
}
.flag{font-size:3.6rem;margin-bottom:10px;line-height:1}
.home-title{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.home-title span{color:var(--accent)}
.home-sub{color:var(--text2);font-size:.95rem;line-height:1.6;max-width:360px;margin:0 auto}

/* ── Voice pill ── */
.voice-pill{
  display:flex;align-items:center;gap:8px;margin:14px 16px 0;
  padding:10px 14px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;font-size:.82rem;color:var(--text2)
}
.voice-dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex-shrink:0}
.voice-dot.warn{background:var(--amber)}

/* ── Progress card ── */
.progress-card{
  margin:12px 16px 0;padding:16px 18px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--radius)
}
.progress-card h3{font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.pb-outer{background:var(--border);border-radius:99px;height:7px;margin-bottom:8px}
.pb-inner{height:7px;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .5s}
.pb-label{color:var(--text2);font-size:.88rem}
.pb-label span{color:var(--accent);font-weight:700}

/* ── Module grid ── */
.modules-grid{display:flex;flex-direction:column;gap:10px;padding:14px 16px 32px}
.module-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;cursor:pointer;display:flex;align-items:center;gap:14px;
  transition:border-color .15s,transform .15s;text-decoration:none;color:inherit
}
.module-card:active{transform:scale(.98);border-color:var(--accent)}
.module-icon{font-size:2rem;flex-shrink:0;width:44px;text-align:center;line-height:1}
.module-info{flex:1;min-width:0}
.module-name{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:3px}
.module-desc{color:var(--text2);font-size:.85rem;line-height:1.4;white-space:normal;word-break:break-word}
.module-count{color:var(--text3);font-size:.78rem;margin-top:4px}

/* ── Tab bar ── */
.tabs{
  display:flex;gap:6px;padding:12px 16px;background:var(--surface);
  border-bottom:1px solid var(--border);overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  padding:8px 16px;border-radius:20px;border:1px solid var(--border);
  background:none;color:var(--text2);font-size:.88rem;cursor:pointer;
  white-space:nowrap;flex-shrink:0;min-height:40px;transition:all .15s
}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.tab:active:not(.active){background:rgba(79,140,255,.1)}

/* ── Content area ── */
.content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}

/* ── Category label ── */
.cat-label{
  font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
  color:var(--text3);padding:16px 0 8px;border-bottom:1px solid var(--border);margin-bottom:10px
}
.cat-label:first-child{padding-top:4px}

/* ── Phrase card ── */
.phrase-list{display:flex;flex-direction:column;gap:10px}
.phrase-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px;display:flex;gap:12px;align-items:flex-start
}
.phrase-texts{flex:1;min-width:0}
.p-en{
  font-size:1rem;font-weight:700;color:var(--text);
  line-height:1.35;word-break:break-word;margin-bottom:6px
}
.p-bg{
  font-size:1.45rem;font-weight:800;color:var(--text);
  line-height:1.3;word-break:break-word;margin-bottom:4px
}
.p-tr{font-size:.92rem;color:var(--accent);font-style:italic;margin-bottom:4px;word-break:break-word}
.p-ph{
  font-size:.88rem;color:var(--ph-color);font-weight:600;margin-bottom:6px;word-break:break-word
}
.p-ph::before{content:'🔊 '}
.p-usage{
  font-size:.8rem;color:var(--text3);background:rgba(255,255,255,.04);
  padding:6px 10px;border-radius:8px;line-height:1.45;word-break:break-word;margin-top:4px
}
.p-usage::before{content:'💡 '}

/* ── Play button ── */
.play-btn{
  background:var(--accent);border:none;color:#fff;
  width:48px;height:48px;border-radius:50%;font-size:1.1rem;
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 10px rgba(79,140,255,.4);transition:all .15s;margin-top:2px
}
.play-btn:active{transform:scale(.92);box-shadow:0 1px 4px rgba(79,140,255,.3)}
.play-btn.playing{background:var(--accent2);animation:pulse .9s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(124,79,255,.4)}50%{box-shadow:0 0 0 8px rgba(124,79,255,0)}}

/* ── Pronunciation guide legend ── */
.ph-legend{
  background:rgba(251,146,60,.08);border:1px solid rgba(251,146,60,.25);
  border-radius:12px;padding:14px 16px;margin-bottom:14px;font-size:.84rem;line-height:1.7;color:var(--text2)
}
.ph-legend strong{color:var(--ph-color)}
.ph-legend h4{color:var(--ph-color);font-size:.85rem;margin-bottom:8px}

/* ── Info tip box ── */
.tip-box{
  background:rgba(79,140,255,.08);border:1px solid rgba(79,140,255,.2);
  border-radius:12px;padding:14px 16px;margin-bottom:14px;
  font-size:.87rem;color:var(--text2);line-height:1.6
}
.tip-box strong{color:var(--accent)}

/* ── Flashcard ── */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:4px 0 24px}
.fc-counter{color:var(--text3);font-size:.88rem}
.fc{
  width:100%;max-width:480px;min-height:260px;
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:28px 24px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;cursor:pointer;
  box-shadow:var(--shadow);position:relative;transition:transform .12s
}
.fc:active{transform:scale(.98)}
.fc-hint{position:absolute;top:12px;right:14px;font-size:.75rem;color:var(--text3)}
.fc-en{font-size:1.2rem;font-weight:800;color:var(--text);margin-bottom:12px;line-height:1.3}
.fc-bg{font-size:2.1rem;font-weight:800;color:var(--text);line-height:1.25;margin-bottom:6px}
.fc-tr{font-size:1rem;color:var(--accent);font-style:italic;margin-bottom:6px}
.fc-ph{font-size:.95rem;color:var(--ph-color);font-weight:600;margin-bottom:8px}
.fc-usage{font-size:.82rem;color:var(--text3);background:rgba(255,255,255,.04);padding:8px 12px;border-radius:8px;line-height:1.45;width:100%}
.fc-back{display:none}
.fc.flipped .fc-front{display:none}
.fc.flipped .fc-back{display:block;width:100%}
.fc-audio-row{display:flex;justify-content:center;margin-top:14px}
.fc-audio-btn{
  background:var(--accent);border:none;color:#fff;
  padding:10px 24px;border-radius:20px;font-size:.92rem;
  cursor:pointer;display:flex;align-items:center;gap:8px
}
.fc-audio-btn:active{background:var(--accent2)}

.fc-nav{display:flex;gap:10px;width:100%;max-width:480px}
.fc-btn{
  flex:1;padding:14px 8px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:.92rem;
  cursor:pointer;font-weight:600;min-height:50px;transition:all .15s
}
.fc-btn:active{border-color:var(--accent);color:var(--accent)}
.fc-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.fc-btn.primary:active{background:var(--accent2)}

.fc-rate{display:flex;gap:8px;width:100%;max-width:480px}
.rate-btn{
  flex:1;padding:12px 6px;border-radius:12px;border:none;
  font-size:.88rem;font-weight:700;cursor:pointer;min-height:48px
}
.r-hard{background:rgba(239,68,68,.18);color:var(--red)}
.r-hard:active{background:var(--red);color:#fff}
.r-ok{background:rgba(245,158,11,.18);color:var(--amber)}
.r-ok:active{background:var(--amber);color:#fff}
.r-easy{background:rgba(34,197,94,.18);color:var(--green)}
.r-easy:active{background:var(--green);color:#fff}

/* ── Quiz ── */
.quiz-wrap{display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto}
.quiz-top{display:flex;align-items:center;gap:12px}
.quiz-pb{flex:1;height:6px;background:var(--border);border-radius:99px}
.quiz-pb-fill{height:6px;border-radius:99px;background:var(--accent);transition:width .4s}
.quiz-score-lbl{color:var(--text2);font-size:.88rem;white-space:nowrap}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:24px 20px}
.q-type-lbl{font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.q-en{font-size:1.25rem;font-weight:800;color:var(--text);line-height:1.35;margin-bottom:4px;word-break:break-word}
.q-bg{font-size:2rem;font-weight:800;color:var(--text);line-height:1.2;margin-bottom:6px}
.q-tr{font-size:.95rem;color:var(--accent);font-style:italic;margin-bottom:4px}
.q-ph{font-size:.88rem;color:var(--ph-color);font-weight:600;margin-bottom:16px}
.q-audio-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(79,140,255,.12);border:1px solid var(--accent);
  color:var(--accent);padding:10px 18px;border-radius:12px;font-size:.92rem;
  cursor:pointer;margin-bottom:16px;min-height:48px
}
.quiz-opts{display:flex;flex-direction:column;gap:8px}
.opt{
  width:100%;padding:14px 18px;text-align:left;
  background:var(--surface);border:1.5px solid var(--border);border-radius:12px;
  color:var(--text);font-size:.95rem;cursor:pointer;line-height:1.4;
  min-height:52px;word-break:break-word;transition:border-color .15s
}
.opt:active:not(:disabled){border-color:var(--accent)}
.opt.correct{border-color:var(--green)!important;background:rgba(34,197,94,.14)!important;color:var(--green)!important}
.opt.wrong{border-color:var(--red)!important;background:rgba(239,68,68,.14)!important;color:#ff8080!important}
.opt:disabled{cursor:default}
.quiz-fb{padding:12px 16px;border-radius:12px;font-size:.9rem;line-height:1.5;margin-top:6px;word-break:break-word}
.quiz-fb.ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green)}
.quiz-fb.no{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#ff8888}
.quiz-next{
  width:100%;padding:14px;background:var(--accent);border:none;
  color:#fff;border-radius:12px;font-size:.98rem;font-weight:700;
  cursor:pointer;margin-top:10px;min-height:50px
}
.quiz-next:active{background:var(--accent2)}
.quiz-done{text-align:center;padding:32px 16px}
.quiz-done-emoji{font-size:3.5rem;margin-bottom:12px}
.quiz-done-pct{font-size:3rem;font-weight:800;color:var(--accent);margin-bottom:6px}
.quiz-done h2{font-size:1.4rem;margin-bottom:8px}
.quiz-done p{color:var(--text2);font-size:.95rem;margin-bottom:20px;line-height:1.5}

/* ── Alphabet ── */
.alpha-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.alpha-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px 10px;text-align:center;cursor:pointer;transition:border-color .15s
}
.alpha-card:active{border-color:var(--accent)}
.alpha-big{font-size:2rem;font-weight:800;color:var(--text);margin-bottom:2px;line-height:1.2}
.alpha-small{font-size:1.3rem;color:var(--text2);margin-bottom:6px}
.alpha-sound{font-size:.82rem;color:var(--accent);font-style:italic;margin-bottom:2px}
.alpha-ph{font-size:.78rem;color:var(--ph-color);font-weight:600;margin-bottom:4px}
.alpha-ex{font-size:.75rem;color:var(--text3);line-height:1.3}

/* ── Numbers ── */
.num-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px}
.num-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:14px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:border-color .15s
}
.num-card:active{border-color:var(--accent)}
.num-n{font-size:1.7rem;font-weight:800;color:var(--accent);min-width:38px}
.num-bg{font-size:1rem;font-weight:700;color:var(--text)}
.num-tr{font-size:.82rem;color:var(--accent);font-style:italic}
.num-ph{font-size:.78rem;color:var(--ph-color);font-weight:600}

/* ── Dialogue ── */
.dlg-scenario{background:var(--card);border:1px solid var(--border);border-radius:20px;margin-bottom:12px;overflow:hidden}
.dlg-header{
  padding:16px 18px;background:linear-gradient(135deg,rgba(79,140,255,.1),rgba(124,79,255,.07));
  border-bottom:1px solid transparent;cursor:pointer;display:flex;align-items:center;gap:12px;
  min-height:72px
}
.dlg-scenario.open .dlg-header{border-bottom-color:var(--border)}
.dlg-icon{font-size:1.8rem;flex-shrink:0}
.dlg-meta{flex:1;min-width:0}
.dlg-title{font-size:1rem;font-weight:700;color:var(--text);margin-bottom:2px}
.dlg-sub{font-size:.82rem;color:var(--text2);white-space:normal;word-break:break-word}
.dlg-chev{margin-left:auto;color:var(--text3);font-size:.9rem;transition:transform .2s;flex-shrink:0}
.dlg-scenario.open .dlg-chev{transform:rotate(180deg)}
.dlg-body{display:none;padding:16px}
.dlg-scenario.open .dlg-body{display:block}
.dlg-play-all{
  width:100%;padding:12px;background:rgba(79,140,255,.1);border:1px solid rgba(79,140,255,.3);
  border-radius:12px;color:var(--accent);font-size:.92rem;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:14px;min-height:48px
}
.dlg-play-all:active{background:rgba(79,140,255,.2)}
.dlg-line{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}
.dlg-line.you{flex-direction:row-reverse}
.spk-lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--text3);margin-bottom:5px}
.dlg-line.you .spk-lbl{color:var(--accent);text-align:right}
.bubble{
  max-width:80%;padding:12px 15px;background:var(--surface);
  border:1px solid var(--border);border-radius:16px;border-top-left-radius:4px
}
.dlg-line.you .bubble{
  background:rgba(79,140,255,.12);border-color:rgba(79,140,255,.28);
  border-radius:16px;border-top-right-radius:4px
}
.b-bg{font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:3px;word-break:break-word;line-height:1.3}
.b-tr{font-size:.85rem;color:var(--accent);font-style:italic;margin-bottom:2px;word-break:break-word}
.b-ph{font-size:.8rem;color:var(--ph-color);font-weight:600;margin-bottom:3px}
.b-en{font-size:.85rem;color:var(--text2);word-break:break-word;line-height:1.35}
.b-play{
  background:none;border:none;color:var(--text3);
  font-size:.8rem;cursor:pointer;margin-top:7px;padding:0;
  display:flex;align-items:center;gap:5px;min-height:32px
}
.b-play:active{color:var(--accent)}

/* ── Responsive tweaks ── */
@media(min-width:600px){
  .fc{min-height:300px}
  .fc-bg{font-size:2.4rem}
  .modules-grid{display:grid;grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app">

<!-- HOME -->
<div id="s-home" class="screen active">
  <div class="home-header">
    <div class="flag">🇧🇬</div>
    <h1 class="home-title">Sofia <span>Ready</span></h1>
    <p class="home-sub">Learn Bulgarian from English in 4 hours — real phrases, accurate pronunciation, works offline on Android.</p>
  </div>
  <div class="voice-pill">
    <div class="voice-dot" id="v-dot"></div>
    <span id="v-label">Checking Bulgarian audio…</span>
  </div>
  <div class="progress-card">
    <h3>Your Progress</h3>
    <div class="pb-outer"><div class="pb-inner" id="pb" style="width:0%"></div></div>
    <div class="pb-label">Mastered <span id="pb-n">0</span> of <span id="pb-t">0</span> phrases</div>
  </div>
  <div class="modules-grid" id="home-grid"></div>
</div>

<!-- MODULE -->
<div id="s-module" class="screen">
  <nav>
    <button class="nav-back" onclick="goHome()">←</button>
    <span class="nav-title" id="mod-title"></span>
    <div class="nav-spacer"></div>
  </nav>
  <div class="tabs" id="mod-tabs">
    <button class="tab active" onclick="switchTab('list',this)">📖 Browse</button>
    <button class="tab" onclick="switchTab('flash',this)">🃏 Flashcards</button>
    <button class="tab" onclick="switchTab('quiz',this)">🎯 Quiz</button>
  </div>
  <div class="content" id="mod-content"></div>
</div>

<!-- ALPHABET -->
<div id="s-alpha" class="screen">
  <nav>
    <button class="nav-back" onclick="goHome()">←</button>
    <span class="nav-title">Cyrillic Alphabet</span>
    <div class="nav-spacer"></div>
  </nav>
  <div class="content" id="alpha-content"></div>
</div>

<!-- DIALOGUES -->
<div id="s-dlg" class="screen">
  <nav>
    <button class="nav-back" onclick="goHome()">←</button>
    <span class="nav-title">Real Dialogues</span>
    <div class="nav-spacer"></div>
  </nav>
  <div class="content" id="dlg-content"></div>
</div>

</div>
<script>
// ═══════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════

const ALPHABET = [
  {U:'А',l:'а',sound:'a',ph:'like "a" in father',ex:'авто (avto) — car'},
  {U:'Б',l:'б',sound:'b',ph:'"b" as in boy',ex:'банан (banan) — banana'},
  {U:'В',l:'в',sound:'v',ph:'"v" as in vine',ex:'вода (voda) — water'},
  {U:'Г',l:'г',sound:'g',ph:'"g" as in go',ex:'град (grad) — city'},
  {U:'Д',l:'д',sound:'d',ph:'"d" as in day',ex:'ден (den) — day'},
  {U:'Е',l:'е',sound:'e',ph:'"e" as in bed',ex:'есен (esen) — autumn'},
  {U:'Ж',l:'ж',sound:'zh',ph:'like "s" in measure / "g" in beige',ex:'жена (zhena) — woman'},
  {U:'З',l:'з',sound:'z',ph:'"z" as in zero',ex:'зима (zima) — winter'},

    {spk:'You',you:true,bg:'А Левски?',tr:'A Levski?',ph:'ah LEV-skee',en:'And Levski?'},
    {spk:'Local',you:false,bg:'Стига! Много различни! ЦСКА е номер едно!',tr:'Stiga! Mnogo razlichni! TSKA e nomer edno!',ph:'STEE-gah! MNOH-goh rahz-LEECH-nee! TSEH-skah eh NOH-mer ED-noh',en:'Stop it! Very different! CSKA is number one!'},

];

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════

let progress = JSON.parse(localStorage.getItem('bg2_prog') || '{}');
let curMod = null, curTab = 'list';
let fcItems = [], fcIdx = 0, fcFlipped = false;
let qItems = [], qIdx = 0, qScore = 0, qAnswered = false;
let synth = window.speechSynthesis;
let bgVoice = null;
let curUtt = null;
let activeBtns = new Set();

function saveProgress(){ localStorage.setItem('bg2_prog', JSON.stringify(progress)); }
function mark(key){ progress[key] = (progress[key]||0)+1; saveProgress(); updateHomeProgress(); }
function getAllPhrases(){ return MODULES.filter(m=>!m.isNumbers).flatMap(m=>m.cats.flatMap(c=>c.items)); }
function learnedCount(){ return Object.keys(progress).filter(k=>progress[k]>0).length; }

// ═══════════════════════════════════════════════════════
// VOICE / TTS
// ═══════════════════════════════════════════════════════

function initVoices(){
  const voices = synth.getVoices();
  bgVoice = voices.find(v=> /^bg/i.test(v.lang)) || null;
  const dot = document.getElementById('v-dot');
  const lbl = document.getElementById('v-label');
  if(!dot) return;
  if(bgVoice){
    dot.className='voice-dot';
    lbl.textContent=`Bulgarian voice ready: ${bgVoice.name}`;
  } else {
    dot.className='voice-dot warn';
    lbl.textContent='No Bulgarian voice found — open in Chrome on Android for best audio';
  }
}

synth.onvoiceschanged = initVoices;
setTimeout(initVoices, 400);

function speak(text, btnEl){
  synth.cancel(); curUtt=null;
  activeBtns.forEach(b=>{ b.textContent='▶'; b.classList.remove('playing'); });
  activeBtns.clear();
  const u = new SpeechSynthesisUtterance(text);
  u.lang='bg-BG';
  if(bgVoice) u.voice=bgVoice;
  u.rate=0.82; u.pitch=1;
  if(btnEl){
    btnEl.textContent='■'; btnEl.classList.add('playing'); activeBtns.add(btnEl);
    u.onend=()=>{ btnEl.textContent='▶'; btnEl.classList.remove('playing'); activeBtns.delete(btnEl); curUtt=null; };
    u.onerror=()=>{ btnEl.textContent='▶'; btnEl.classList.remove('playing'); activeBtns.delete(btnEl); curUtt=null; };
  }
  curUtt=u; synth.speak(u);
}

async function speakSeq(texts, gap=1100){
  for(const t of texts){
    await new Promise(res=>{
      synth.cancel();
      const u=new SpeechSynthesisUtterance(t);
      u.lang='bg-BG'; if(bgVoice) u.voice=bgVoice; u.rate=0.82;
      u.onend=()=>setTimeout(res,gap); u.onerror=()=>res();
      curUtt=u; synth.speak(u);
    });
  }
}

// ═══════════════════════════════════════════════════════
// SCREENS
// ═══════════════════════════════════════════════════════

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
  synth.cancel();
}

function goHome(){ showScreen('s-home'); updateHomeProgress(); }

function updateHomeProgress(){
  const all=getAllPhrases(), total=all.length, n=learnedCount();
  document.getElementById('pb').style.width=(total?Math.round(n/total*100):0)+'%';
  document.getElementById('pb-n').textContent=n;
  document.getElementById('pb-t').textContent=total;
}

// ═══════════════════════════════════════════════════════
// HOME RENDER
// ═══════════════════════════════════════════════════════

function renderHome(){
  const grid=document.getElementById('home-grid');
  grid.innerHTML='';
  const cards=[
    ...MODULES.map(m=>({
      icon:m.icon, name:m.name, desc:m.desc,
      count: m.isNumbers ? NUMBERS.length+' numbers' : m.cats.reduce((a,c)=>a+c.items.length,0)+' phrases',
      onclick:`openMod('${m.id}')`
    })),
    {icon:'🔡',name:'Cyrillic Alphabet',desc:'Learn to read Bulgarian script — tap any letter to hear it',count:ALPHABET.length+' letters',onclick:'openAlpha()'},
    {icon:'🎭',name:'Real Dialogues',desc:'6 full conversations: café, restaurant, market, taxi, bar, football',count:DIALOGUES.length+' scenarios',onclick:'openDlg()'},
  ];
  cards.forEach(c=>{
    const d=document.createElement('div');
    d.className='module-card'; d.setAttribute('onclick',c.onclick);
    d.innerHTML=`<div class="module-icon">${c.icon}</div><div class="module-info"><div class="module-name">${c.name}</div><div class="module-desc">${c.desc}</div><div class="module-count">${c.count}</div></div>`;
    grid.appendChild(d);
  });
  updateHomeProgress();
}

// ═══════════════════════════════════════════════════════
// MODULE
// ═══════════════════════════════════════════════════════

function openMod(id){
  curMod=MODULES.find(m=>m.id===id);
  if(!curMod) return;
  curTab='list';
  document.getElementById('mod-title').textContent=curMod.name;
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',i===0));
  showScreen('s-module');
  renderList();
}

function switchTab(tab,btn){
  curTab=tab; synth.cancel();
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  if(tab==='list') renderList();
  else if(tab==='flash') startFlash();
  else if(tab==='quiz') startQuiz();
}

// ── Browse ──

function renderList(){
  const el=document.getElementById('mod-content');
  if(curMod.isNumbers){ renderNumbers(el); return; }
  let h=`<div class="phrase-list">`;
  curMod.cats.forEach(cat=>{
    h+=`<div class="cat-label">${cat.lbl}</div>`;
    cat.items.forEach(item=>{
      h+=`<div class="phrase-card">
        <div class="phrase-texts">
          <div class="p-en">${esc(item.en)}</div>
          <div class="p-bg">${esc(item.bg)}</div>
          <div class="p-tr">${esc(item.tr)}</div>
          <div class="p-ph">${esc(item.ph)}</div>
          ${item.usage?`<div class="p-usage">${esc(item.usage)}</div>`:''}
        </div>
        <button class="play-btn" onclick="speak('${escJ(item.bg)}',this)" aria-label="Play audio">▶</button>
      </div>`;
    });
  });
  h+=`</div>`;
  el.innerHTML=h;
}

function renderNumbers(el){
  el.innerHTML=`
    <div class="tip-box"><strong>Currency tip:</strong> Bulgaria uses лев (lev), plural лева (leva). €1 ≈ 1.96 лв. Knowing 1–20 and the tens covers almost every transaction.</div>
    <div class="num-grid">
      ${NUMBERS.map(n=>`
        <div class="num-card" onclick="speak('${escJ(n.bg)}')">
          <div class="num-n">${n.n}</div>
          <div><div class="num-bg">${n.bg}</div><div class="num-tr">${n.tr}</div><div class="num-ph">${n.ph}</div></div>
        </div>`).join('')}
    </div>`;
}

// ── Flashcard ──

function getModItems(){
  if(!curMod) return [];
  if(curMod.isNumbers) return NUMBERS.map(n=>({en:String(n.n),bg:n.bg,tr:n.tr,ph:n.ph,usage:''}));
  return curMod.cats.flatMap(c=>c.items);
}

function startFlash(){
  fcItems=getModItems(); fcIdx=0; fcFlipped=false;
  renderFC();
}

function renderFC(){
  const el=document.getElementById('mod-content');
  if(!fcItems.length){ el.innerHTML='<p style="color:var(--text3);text-align:center;padding:40px">No items.</p>'; return; }
  const item=fcItems[fcIdx];
  el.innerHTML=`
    <div class="fc-wrap">
      <div class="fc-counter">${fcIdx+1} / ${fcItems.length}</div>
      <div class="fc" id="fc-card" onclick="flipFC()">
        <div class="fc-hint" id="fc-hint">Tap to reveal</div>
        <div id="fc-front">
          <div class="fc-en">${esc(item.en)}</div>
          <div style="color:var(--text3);font-size:.88rem;margin-top:8px">What is this in Bulgarian?</div>
        </div>
        <div id="fc-back" style="display:none;width:100%">
          <div class="fc-bg">${esc(item.bg)}</div>
          <div class="fc-tr">${esc(item.tr)}</div>
          <div class="fc-ph">${esc(item.ph)}</div>
          ${item.usage?`<div class="fc-usage">${esc(item.usage)}</div>`:''}
          <div class="fc-audio-row">
            <button class="fc-audio-btn" onclick="event.stopPropagation();speak('${escJ(item.bg)}')">▶ Play audio</button>
          </div>
        </div>
      </div>
      <div class="fc-nav">
        <button class="fc-btn" id="fc-prev" onclick="fcMove(-1)">← Prev</button>
        <button class="fc-btn primary" onclick="speak('${escJ(item.bg)}')">▶ Audio</button>
        <button class="fc-btn" id="fc-next" onclick="fcMove(1)">Next →</button>
      </div>
      <div class="fc-rate" id="fc-rate" style="display:none">
        <button class="rate-btn r-hard" onclick="fcRate('hard')">😰 Hard</button>
        <button class="rate-btn r-ok" onclick="fcRate('ok')">😐 OK</button>
        <button class="rate-btn r-easy" onclick="fcRate('easy')">✓ Easy</button>
      </div>
    </div>`;
}

function flipFC(){
  fcFlipped=true;
  document.getElementById('fc-front').style.display='none';
  document.getElementById('fc-back').style.display='block';
  document.getElementById('fc-hint').textContent='Tap to flip back';
  document.getElementById('fc-rate').style.display='flex';
  document.getElementById('fc-card').onclick=unflipFC;
  speak(fcItems[fcIdx].bg);
}

function unflipFC(){
  fcFlipped=false;
  document.getElementById('fc-front').style.display='block';
  document.getElementById('fc-back').style.display='none';
  document.getElementById('fc-hint').textContent='Tap to reveal';
  document.getElementById('fc-rate').style.display='none';
  document.getElementById('fc-card').onclick=flipFC;
}

function fcMove(dir){
  fcIdx=(fcIdx+dir+fcItems.length)%fcItems.length;
  fcFlipped=false; synth.cancel();
  renderFC();
}

function fcRate(r){
  if(r!=='hard') mark(fcItems[fcIdx].bg);
  fcMove(1);
}

// ── Quiz ──

function startQuiz(){
  const all=getModItems();
  if(all.length<4){ document.getElementById('mod-content').innerHTML='<p style="color:var(--text3);text-align:center;padding:40px">Need at least 4 phrases for quiz.</p>'; return; }
  qItems=shuffle([...all]).slice(0,Math.min(15,all.length));
  qIdx=0; qScore=0; qAnswered=false;
  renderQ();
}

function renderQ(){
  const el=document.getElementById('mod-content');
  if(qIdx>=qItems.length){ renderQDone(el); return; }
  const item=qItems[qIdx];
  const all=getModItems();
  const wrong=shuffle(all.filter(x=>x.bg!==item.bg)).slice(0,3);
  const opts=shuffle([item,...wrong]);
  const type=qIdx%3; // 0=EN→BG, 1=BG→EN, 2=listen→BG

  let questionHTML='';
  if(type===0){
    questionHTML=`<div class="q-type-lbl">Choose the Bulgarian phrase</div>
      <div class="q-en">${esc(item.en)}</div>`;
  } else if(type===1){
    questionHTML=`<div class="q-type-lbl">What does this mean in English?</div>
      <div class="q-bg">${esc(item.bg)}</div>
      <div class="q-tr">${esc(item.tr)}</div>
      <div class="q-ph">${esc(item.ph)}</div>`;
  } else {
    questionHTML=`<div class="q-type-lbl">Listen and choose the phrase you hear</div>
      <button class="q-audio-btn" onclick="speak('${escJ(item.bg)}')">▶ Play audio</button>`;
    setTimeout(()=>speak(item.bg),300);
  }

  const optsHTML=opts.map(o=>{
    const lbl=type===1 ? esc(o.en) : `${esc(o.bg)}<br><em style="font-size:.82rem;color:var(--text3)">${esc(o.tr)}</em>`;
    return `<button class="opt" data-bg="${escA(o.bg)}" onclick="answerQ('${escJ(o.bg)}','${escJ(item.bg)}')">${lbl}</button>`;
  }).join('');

  el.innerHTML=`
    <div class="quiz-wrap">
      <div class="quiz-top">
        <div class="quiz-pb"><div class="quiz-pb-fill" style="width:${qIdx/qItems.length*100}%"></div></div>
        <div class="quiz-score-lbl">${qScore}/${qIdx}</div>
      </div>
      <div class="quiz-card">
        ${questionHTML}
        <div class="quiz-opts">${optsHTML}</div>
        <div id="q-fb"></div>
      </div>
    </div>`;
}

function answerQ(chosen, correct){
  if(qAnswered) return;
  qAnswered=true;
  const isOk=chosen===correct;
  if(isOk){ qScore++; mark(correct); }

  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    const bg=b.getAttribute('data-bg');
    if(bg===correct) b.classList.add('correct');
    else if(!isOk && bg===chosen) b.classList.add('wrong');
  });

  const correctItem=getModItems().find(x=>x.bg===correct);
  const fb=document.getElementById('q-fb');
  fb.className='quiz-fb '+(isOk?'ok':'no');
  fb.innerHTML=isOk
    ? `✓ Correct! &nbsp;<strong>${esc(correctItem?.bg)}</strong> = ${esc(correctItem?.en)}`
    : `✗ Answer: &nbsp;<strong>${esc(correctItem?.bg)}</strong> (${esc(correctItem?.ph)}) = ${esc(correctItem?.en)}`;

  const btn=document.createElement('button');
  btn.className='quiz-next'; btn.textContent=qIdx+1>=qItems.length?'See Results →':'Next →';
  btn.onclick=()=>{ qAnswered=false; qIdx++; renderQ(); };
  fb.after(btn);
}

function renderQDone(el){
  const pct=Math.round(qScore/qItems.length*100);
  const emoji=pct>=80?'🎉':pct>=60?'👍':'💪';
  el.innerHTML=`
    <div class="quiz-done">
      <div class="quiz-done-emoji">${emoji}</div>
      <div class="quiz-done-pct">${qScore}/${qItems.length}</div>
      <h2>${pct}% Correct</h2>
      <p>${pct>=80?'Excellent! You\'re getting it!':pct>=60?'Good progress — keep going!':'Repetition is the key — try again!'}</p>
      <button class="quiz-next" style="max-width:260px;margin:0 auto" onclick="startQuiz()">Try Again</button>
    </div>`;
}

function toggleDlg(i){

}

function playDlg(i){

}

// ═══════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escJ(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function escA(s){ return String(s||'').replace(/"/g,'&quot;'); }
function shuffle(a){ return [...a].sort(()=>Math.random()-.5); }

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════

renderHome();
</script>
