<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Sofia Ready — Learn Bulgarian</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --card: #22263a;
  --border: #2e3350;
  --accent: #4f7cff;
  --accent2: #7c4fff;
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #f59e0b;
  --text: #e8eaf6;
  --text2: #9ba3c9;
  --text3: #6370a0;
  --radius: 16px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Layout ── */
#app { min-height: 100vh; display: flex; flex-direction: column; }
.screen { display: none; flex-direction: column; min-height: 100vh; }
.screen.active { display: flex; }

/* ── Nav ── */
nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: 0; z-index: 100;
}
.nav-title { font-size: 1.1rem; font-weight: 700; color: var(--text); }
.nav-back { background: none; border: none; color: var(--accent); font-size: 1rem; cursor: pointer; padding: 6px 10px; border-radius: 8px; }
.nav-back:hover { background: rgba(79,124,255,0.12); }

/* ── Home Screen ── */
.home-header {
  background: linear-gradient(135deg, #1a1d27 0%, #12162a 100%);
  padding: 48px 24px 40px; text-align: center;
  border-bottom: 1px solid var(--border);
}
.flag { font-size: 4rem; margin-bottom: 12px; }
.home-title { font-size: 2rem; font-weight: 800; margin-bottom: 8px; }
.home-title span { color: var(--accent); }
.home-sub { color: var(--text2); font-size: 1rem; line-height: 1.6; max-width: 400px; margin: 0 auto; }

.progress-summary {
  margin: 24px; padding: 20px; background: var(--card);
  border-radius: var(--radius); border: 1px solid var(--border);
}
.progress-summary h3 { font-size: 0.85rem; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }
.progress-bar-outer { background: var(--border); border-radius: 99px; height: 8px; margin-bottom: 8px; }
.progress-bar-inner { height: 8px; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.5s; }
.progress-label { color: var(--text2); font-size: 0.9rem; }
.progress-label span { color: var(--accent); font-weight: 700; }

.modules-grid { display: flex; flex-direction: column; gap: 12px; padding: 0 20px 24px; }
.module-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
  cursor: pointer; transition: all 0.18s; display: flex; align-items: center; gap: 16px;
}
.module-card:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow); }
.module-icon { font-size: 2.2rem; flex-shrink: 0; width: 52px; text-align: center; }
.module-info { flex: 1; min-width: 0; }
.module-name { font-size: 1.05rem; font-weight: 700; margin-bottom: 4px; }
.module-desc { color: var(--text2); font-size: 0.9rem; line-height: 1.4; }
.module-count { color: var(--text3); font-size: 0.8rem; margin-top: 4px; }
.module-progress { font-size: 0.8rem; color: var(--green); font-weight: 600; flex-shrink: 0; }

/* ── Module Screen ── */
.mode-tabs { display: flex; gap: 8px; padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab-btn {
  padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
  background: none; color: var(--text2); font-size: 0.9rem; cursor: pointer;
  white-space: nowrap; transition: all 0.15s; flex-shrink: 0;
}
.tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.tab-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

.mode-content { flex: 1; overflow-y: auto; padding: 20px; }

/* ── Phrase List ── */
.phrase-list { display: flex; flex-direction: column; gap: 12px; }
.phrase-item {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
  display: flex; align-items: flex-start; gap: 14px;
}
.phrase-item:hover { border-color: var(--border); }
.phrase-text-col { flex: 1; min-width: 0; }
.phrase-cyrillic { font-size: 1.5rem; font-weight: 700; color: var(--text); line-height: 1.3; margin-bottom: 4px; }
.phrase-translit { font-size: 1rem; color: var(--accent); font-style: italic; margin-bottom: 6px; }
.phrase-english { font-size: 0.95rem; color: var(--text2); margin-bottom: 6px; }
.phrase-usage { font-size: 0.82rem; color: var(--text3); background: rgba(255,255,255,0.04); padding: 6px 10px; border-radius: 8px; line-height: 1.4; }
.play-btn {
  background: var(--accent); border: none; color: #fff;
  width: 44px; height: 44px; border-radius: 50%; font-size: 1.2rem;
  cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; box-shadow: 0 2px 8px rgba(79,124,255,0.4);
}
.play-btn:hover { transform: scale(1.1); box-shadow: 0 4px 16px rgba(79,124,255,0.5); }
.play-btn:active { transform: scale(0.95); }
.play-btn.playing { background: var(--accent2); animation: pulse 0.8s infinite; }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(124,79,255,0.4)} 50%{box-shadow:0 0 0 8px rgba(124,79,255,0)} }

/* ── Flashcard ── */
.flashcard-container { display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 20px; }
.flashcard-counter { color: var(--text3); font-size: 0.9rem; }
.flashcard {
  width: 100%; max-width: 480px; min-height: 280px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; padding: 32px 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; cursor: pointer; transition: all 0.15s;
  box-shadow: var(--shadow); position: relative;
}
.flashcard:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
.flashcard-hint { font-size: 0.8rem; color: var(--text3); position: absolute; top: 16px; right: 16px; }
.card-cyrillic { font-size: 2.4rem; font-weight: 800; color: var(--text); margin-bottom: 12px; line-height: 1.2; }
.card-translit { font-size: 1.2rem; color: var(--accent); font-style: italic; margin-bottom: 8px; }
.card-english { font-size: 1.1rem; color: var(--text2); margin-bottom: 16px; }
.card-usage { font-size: 0.85rem; color: var(--text3); line-height: 1.5; background: rgba(255,255,255,0.04); padding: 10px 14px; border-radius: 10px; width: 100%; }
.card-back { display: none; }
.flashcard.flipped .card-front { display: none; }
.flashcard.flipped .card-back { display: block; width: 100%; }

.card-audio-row { display: flex; gap: 12px; margin-top: 16px; justify-content: center; }
.card-play-btn {
  background: var(--accent); border: none; color: #fff;
  padding: 10px 24px; border-radius: 20px; font-size: 0.95rem;
  cursor: pointer; display: flex; align-items: center; gap: 8px;
  transition: all 0.15s;
}
.card-play-btn:hover { background: var(--accent2); }

.flashcard-nav { display: flex; gap: 12px; width: 100%; max-width: 480px; }
.fc-btn {
  flex: 1; padding: 14px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 0.95rem;
  cursor: pointer; transition: all 0.15s; font-weight: 600;
}
.fc-btn:hover { border-color: var(--accent); color: var(--accent); }
.fc-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.fc-btn.primary:hover { background: var(--accent2); border-color: var(--accent2); }

.fc-rating { display: flex; gap: 10px; width: 100%; max-width: 480px; }
.rate-btn {
  flex: 1; padding: 12px 8px; border-radius: 12px; border: none;
  font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: all 0.15s;
}
.rate-hard { background: rgba(239,68,68,0.2); color: var(--red); }
.rate-hard:hover { background: var(--red); color: #fff; }
.rate-ok { background: rgba(245,158,11,0.2); color: var(--yellow); }
.rate-ok:hover { background: var(--yellow); color: #fff; }
.rate-easy { background: rgba(34,197,94,0.2); color: var(--green); }
.rate-easy:hover { background: var(--green); color: #fff; }

/* ── Quiz ── */
.quiz-container { display: flex; flex-direction: column; gap: 20px; max-width: 560px; margin: 0 auto; }
.quiz-progress-row { display: flex; align-items: center; gap: 12px; }
.quiz-progress-bar { flex: 1; height: 6px; background: var(--border); border-radius: 99px; }
.quiz-progress-fill { height: 6px; border-radius: 99px; background: var(--accent); transition: width 0.4s; }
.quiz-score { color: var(--text2); font-size: 0.9rem; white-space: nowrap; }

.quiz-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px; }
.quiz-question-label { font-size: 0.8rem; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 16px; }
.quiz-question { font-size: 1.3rem; font-weight: 700; color: var(--text); line-height: 1.4; margin-bottom: 8px; }
.quiz-question.big { font-size: 2rem; }
.quiz-sub { font-size: 1rem; color: var(--accent); font-style: italic; margin-bottom: 20px; }
.quiz-audio-btn {
  background: rgba(79,124,255,0.15); border: 1px solid var(--accent);
  color: var(--accent); padding: 10px 20px; border-radius: 12px;
  font-size: 0.95rem; cursor: pointer; margin-bottom: 20px;
  display: inline-flex; align-items: center; gap: 8px;
}
.quiz-options { display: flex; flex-direction: column; gap: 10px; }
.opt-btn {
  width: 100%; padding: 16px 20px; text-align: left;
  background: var(--surface); border: 1.5px solid var(--border);
  border-radius: 12px; color: var(--text); font-size: 1rem;
  cursor: pointer; transition: all 0.15s; line-height: 1.4;
}
.opt-btn:hover:not(:disabled) { border-color: var(--accent); background: rgba(79,124,255,0.08); }
.opt-btn.correct { border-color: var(--green) !important; background: rgba(34,197,94,0.15) !important; color: var(--green); }
.opt-btn.wrong { border-color: var(--red) !important; background: rgba(239,68,68,0.15) !important; color: var(--red); }
.opt-btn:disabled { cursor: default; }

.quiz-feedback { padding: 14px 18px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; margin-top: 8px; }
.quiz-feedback.correct { background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: var(--green); }
.quiz-feedback.wrong { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); color: #ff7b7b; }
.quiz-next-btn {
  width: 100%; padding: 14px; background: var(--accent); border: none;
  color: #fff; border-radius: 12px; font-size: 1rem; font-weight: 700;
  cursor: pointer; margin-top: 12px; transition: background 0.15s;
}
.quiz-next-btn:hover { background: var(--accent2); }

.quiz-complete { text-align: center; padding: 40px 20px; }
.quiz-complete-emoji { font-size: 4rem; margin-bottom: 16px; }
.quiz-complete h2 { font-size: 1.6rem; margin-bottom: 8px; }
.quiz-complete p { color: var(--text2); font-size: 1rem; margin-bottom: 24px; }
.quiz-complete-score { font-size: 3rem; font-weight: 800; color: var(--accent); margin-bottom: 8px; }

/* ── Alphabet ── */
.alphabet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.letter-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px 12px; text-align: center; cursor: pointer;
  transition: all 0.15s;
}
.letter-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.letter-bg { font-size: 2rem; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.letter-sm { font-size: 1.3rem; color: var(--text2); margin-bottom: 6px; }
.letter-sound { font-size: 0.85rem; color: var(--accent); font-style: italic; }
.letter-example { font-size: 0.8rem; color: var(--text3); margin-top: 4px; }

/* ── Dialogue ── */
.dialogue-scenario { background: var(--card); border: 1px solid var(--border); border-radius: 20px; margin-bottom: 16px; overflow: hidden; }
.dialogue-header { padding: 18px 20px; background: linear-gradient(135deg, rgba(79,124,255,0.15), rgba(124,79,255,0.1)); border-bottom: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; gap: 12px; }
.dialogue-icon { font-size: 1.8rem; }
.dialogue-title { font-size: 1.05rem; font-weight: 700; }
.dialogue-sub { font-size: 0.85rem; color: var(--text2); margin-top: 2px; }
.dialogue-chevron { margin-left: auto; color: var(--text3); font-size: 1rem; transition: transform 0.2s; }
.dialogue-scenario.open .dialogue-chevron { transform: rotate(180deg); }
.dialogue-body { display: none; padding: 20px; }
.dialogue-scenario.open .dialogue-body { display: block; }

.dialogue-line { display: flex; gap: 12px; margin-bottom: 18px; }
.dialogue-line.you { flex-direction: row-reverse; }
.speaker-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
.dialogue-line .speaker-label { color: var(--text3); }
.dialogue-line.you .speaker-label { color: var(--accent); text-align: right; }
.dialogue-bubble {
  max-width: 75%; padding: 14px 18px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; border-top-left-radius: 4px;
}
.dialogue-line.you .dialogue-bubble {
  background: rgba(79,124,255,0.15); border-color: rgba(79,124,255,0.3);
  border-radius: 16px; border-top-right-radius: 4px;
}
.bubble-cyrillic { font-size: 1.15rem; font-weight: 700; margin-bottom: 4px; }
.bubble-translit { font-size: 0.9rem; color: var(--accent); font-style: italic; margin-bottom: 4px; }
.bubble-english { font-size: 0.88rem; color: var(--text2); }
.bubble-audio { background: none; border: none; color: var(--text3); font-size: 1rem; cursor: pointer; margin-top: 8px; display: flex; align-items: center; gap: 6px; font-size: 0.82rem; }
.bubble-audio:hover { color: var(--accent); }

.dialogue-play-all {
  width: 100%; padding: 12px; background: rgba(79,124,255,0.1); border: 1px solid rgba(79,124,255,0.3);
  border-radius: 12px; color: var(--accent); font-size: 0.95rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
  margin-bottom: 16px;
}
.dialogue-play-all:hover { background: rgba(79,124,255,0.2); }

/* ── Numbers ── */
.numbers-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.num-card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; cursor: pointer;
  transition: all 0.15s; display: flex; align-items: center; gap: 12px;
}
.num-card:hover { border-color: var(--accent); }
.num-arabic { font-size: 1.8rem; font-weight: 800; color: var(--accent); min-width: 40px; }
.num-info .num-bg { font-size: 1.1rem; font-weight: 700; }
.num-info .num-tr { font-size: 0.85rem; color: var(--accent); font-style: italic; }

/* ── TTS Notice ── */
.tts-notice { margin: 12px 20px; padding: 12px 16px; background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); border-radius: 12px; font-size: 0.85rem; color: var(--yellow); display: none; }

/* ── Voice indicator ── */
.voice-status { display: flex; align-items: center; gap: 8px; padding: 10px 20px; font-size: 0.82rem; color: var(--text3); background: var(--surface); border-bottom: 1px solid var(--border); }
.voice-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
.voice-dot.warn { background: var(--yellow); }

/* ── Section headers ── */
.section-header { padding: 0 0 12px; }
.section-title { font-size: 1.1rem; font-weight: 800; color: var(--text); margin-bottom: 4px; }
.section-desc { font-size: 0.88rem; color: var(--text2); line-height: 1.5; }

/* ── Responsive ── */
@media (max-width: 480px) {
  .home-title { font-size: 1.6rem; }
  .card-cyrillic { font-size: 2rem; }
  .phrase-cyrillic { font-size: 1.3rem; }
}

/* ── Tips box ── */
.tips-box { background: rgba(79,124,255,0.08); border: 1px solid rgba(79,124,255,0.2); border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; font-size: 0.9rem; color: var(--text2); line-height: 1.6; }
.tips-box strong { color: var(--accent); }

/* ── Completion badge ── */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 0.75rem; font-weight: 700; }
.badge-done { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }

/* ── Category separator ── */
.cat-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--text3); padding: 16px 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }

/* ── Shake animation ── */
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
.shake { animation: shake 0.4s; }
</style>
</head>
<body>
<div id="app">

<!-- ═══════════════════════════════════════ HOME ═══════════════════════════════════════ -->
<div id="screen-home" class="screen active">
  <div class="home-header">
    <div class="flag">🇧🇬</div>
    <h1 class="home-title">Sofia <span>Ready</span></h1>
    <p class="home-sub">Learn conversational Bulgarian in 4 hours — real phrases, real dialogues, offline forever.</p>
  </div>

  <div id="voice-status-home" class="voice-status">
    <div class="voice-dot" id="voice-dot"></div>
    <span id="voice-label">Checking Bulgarian voice support…</span>
  </div>

  <div class="progress-summary">
    <h3>Your Progress</h3>
    <div class="progress-bar-outer"><div class="progress-bar-inner" id="overall-progress-bar" style="width:0%"></div></div>
    <div class="progress-label">You've mastered <span id="overall-count">0</span> of <span id="overall-total">0</span> phrases</div>
  </div>

  <div class="modules-grid" id="modules-grid"></div>
</div>

<!-- ═══════════════════════════════════════ MODULE ══════════════════════════════════════ -->
<div id="screen-module" class="screen">
  <nav>
    <button class="nav-back" onclick="showHome()">← Back</button>
    <span class="nav-title" id="module-nav-title"></span>
    <span style="width:60px"></span>
  </nav>
  <div class="mode-tabs">
    <button class="tab-btn active" onclick="switchTab('list',this)">📖 Browse</button>
    <button class="tab-btn" onclick="switchTab('flashcard',this)">🃏 Flashcards</button>
    <button class="tab-btn" onclick="switchTab('quiz',this)">🎯 Quiz</button>
  </div>
  <div class="mode-content" id="mode-content"></div>
</div>

<!-- ═══════════════════════════════════════ ALPHABET ═══════════════════════════════════ -->
<div id="screen-alphabet" class="screen">
  <nav>
    <button class="nav-back" onclick="showHome()">← Back</button>
    <span class="nav-title">Cyrillic Alphabet</span>
    <span style="width:60px"></span>
  </nav>
  <div class="mode-content" id="alphabet-content"></div>
</div>

<!-- ═══════════════════════════════════════ DIALOGUES ══════════════════════════════════ -->
<div id="screen-dialogues" class="screen">
  <nav>
    <button class="nav-back" onclick="showHome()">← Back</button>
    <span class="nav-title">Real Dialogues</span>
    <span style="width:60px"></span>
  </nav>
  <div class="mode-content" id="dialogues-content"></div>
</div>

</div><!-- #app -->

<script>
// ══════════════════════════════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════════════════════════════

const ALPHABET = [
  {upper:'А',lower:'а',sound:'a',example:'авто (avto) — car'},
  {upper:'Б',lower:'б',sound:'b',example:'банан (banan) — banana'},
  {upper:'В',lower:'в',sound:'v',example:'вода (voda) — water'},
  {upper:'Г',lower:'г',sound:'g',example:'град (grad) — city'},
  {upper:'Д',lower:'д',sound:'d',example:'ден (den) — day'},
  {upper:'Е',lower:'е',sound:'e',example:'есен (esen) — autumn'},
  {upper:'Ж',lower:'ж',sound:'zh (like "s" in measure)',example:'жена (zhena) — woman'},
  {upper:'З',lower:'з',sound:'z',example:'зима (zima) — winter'},
  {upper:'И',lower:'и',sound:'ee',example:'имам (imam) — I have'},
  {upper:'Й',lower:'й',sound:'y (short)',example:'йогурт (yogurt)'},
  {upper:'К',lower:'к',sound:'k',example:'кафе (kafe) — coffee'},
  {upper:'Л',lower:'л',sound:'l',example:'лято (lyato) — summer'},

let progress = JSON.parse(localStorage.getItem('bg_progress') || '{}');

let bgVoice = null;
let voiceReady = false;
let currentUtterance = null;
let activeBtns = new Set();

function saveProgress() {
  localStorage.setItem('bg_progress', JSON.stringify(progress));
}

function markLearned(phraseKey) {
  progress[phraseKey] = (progress[phraseKey] || 0) + 1;
  saveProgress();
}

function getAllPhrases() {
  const all = [];
  MODULES.forEach(m => {
    if (m.isNumbers) return;
    m.categories.forEach(cat => {
      cat.items.forEach(item => all.push(item));
    });
  });
  return all;
}

function getLearnedCount() {
  return Object.values(progress).filter(v => v > 0).length;
}

// TTS
// ══════════════════════════════════════════════════════════════════════════════

function initVoices() {
  const voices = speechSynth.getVoices();
  bgVoice = voices.find(v => v.lang === 'bg-BG' || v.lang === 'bg') || null;
  updateVoiceUI();
}

function updateVoiceUI() {
  const dot = document.getElementById('voice-dot');
  const label = document.getElementById('voice-label');
  if (!dot || !label) return;
  if (bgVoice) {
    dot.className = 'voice-dot';
    label.textContent = `Bulgarian voice: ${bgVoice.name} — audio ready`;
  } else {
    dot.className = 'voice-dot warn';
    label.textContent = 'No Bulgarian voice found — use Chrome/Edge for best audio support';
  }
  voiceReady = true;
}

speechSynth.onvoiceschanged = initVoices;
initVoices();

function speak(text, btnEl) {
  if (currentUtterance) {
    speechSynth.cancel();
    currentUtterance = null;
  }
  activeBtns.forEach(b => { b.textContent = '▶'; b.classList.remove('playing'); });
  activeBtns.clear();

  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'bg-BG';
  if (bgVoice) utt.voice = bgVoice;
  utt.rate = 0.85;
  utt.pitch = 1;

  if (btnEl) {
    btnEl.textContent = '■';
    btnEl.classList.add('playing');
    activeBtns.add(btnEl);
    utt.onend = () => { btnEl.textContent = '▶'; btnEl.classList.remove('playing'); activeBtns.delete(btnEl); currentUtterance = null; };
    utt.onerror = () => { btnEl.textContent = '▶'; btnEl.classList.remove('playing'); activeBtns.delete(btnEl); currentUtterance = null; };
  }
  currentUtterance = utt;
  speechSynth.speak(utt);
}

async function speakSequence(lines, delay = 1200) {
  for (const line of lines) {
    await new Promise(resolve => {
      if (currentUtterance) speechSynth.cancel();
      const utt = new SpeechSynthesisUtterance(line);
      utt.lang = 'bg-BG';
      if (bgVoice) utt.voice = bgVoice;
      utt.rate = 0.85;
      currentUtterance = utt;
      utt.onend = () => { currentUtterance = null; setTimeout(resolve, delay); };
      utt.onerror = () => { currentUtterance = null; resolve(); };
      speechSynth.speak(utt);
    });
  }
}

  if (currentModule.isNumbers) return NUMBERS.map(n => ({bg:n.bg, tr:n.tr, en:String(n.n), usage:''}));

          <div class="card-cyrillic">${item.bg}</div>
          <div style="color:var(--text3);font-size:0.9rem;margin-top:8px">Tap to see meaning</div>
        </div>
        <div class="card-back">
          <div class="card-cyrillic">${item.bg}</div>
          <div class="card-translit">${item.tr}</div>
          <div class="card-english">${item.en}</div>
          ${item.usage ? `<div class="card-usage">💡 ${item.usage}</div>` : ''}
          <div class="card-audio-row">
            <button class="card-play-btn" onclick="event.stopPropagation();speak('${escStr(item.bg)}')">▶ Play audio</button>
          </div>
        </div>
      </div>
      <div class="flashcard-nav">
        <button class="fc-btn" onclick="fcNav(${JSON.stringify(items).replace(/</g,'&lt;')}, -1)">← Prev</button>
        <button class="fc-btn primary" onclick="speak('${escStr(item.bg)}')">▶ Audio</button>
        <button class="fc-btn" onclick="fcNav(items_ref, 1)">Next →</button>
      </div>
      ${flashFlipped ? `
      <div class="fc-rating">
        <button class="rate-btn rate-hard" onclick="rateCard('hard')">😰 Hard</button>
        <button class="rate-btn rate-ok" onclick="rateCard('ok')">😐 OK</button>
        <button class="rate-btn rate-easy" onclick="rateCard('easy')">😊 Easy</button>
      </div>` : ''}
    </div>`;

  // Store items on window for nav
  window._fcItems = items;

  // Fix nav buttons after render
  el.querySelectorAll('.fc-btn').forEach((b,i) => {
    if (i===0) b.onclick = () => fcNavW(-1);
    if (i===1) b.onclick = () => speak(item.bg);
    if (i===2) b.onclick = () => fcNavW(1);
  });

function flipCard() {
  flashFlipped = true;
  const fc = document.getElementById('fc');
  if (!fc) return;
  fc.classList.add('flipped');
  fc.querySelector('.flashcard-hint').textContent = 'Tap to flip back';
  fc.onclick = () => {
    fc.classList.remove('flipped');
    fc.querySelector('.flashcard-hint').textContent = 'Tap to reveal';
    flashFlipped = false;
    fc.onclick = flipCard;
    // Re-render to remove rating
    showFlashcard(window._fcItems);
  };
  // Add rating buttons
  const container = fc.parentElement;
  const existing = container.querySelector('.fc-rating');
  if (!existing) {
    const rating = document.createElement('div');
    rating.className = 'fc-rating';
    rating.innerHTML = `
      <button class="rate-btn rate-hard" onclick="rateCard('hard')">😰 Hard</button>
      <button class="rate-btn rate-ok" onclick="rateCard('ok')">😐 OK</button>
      <button class="rate-btn rate-easy" onclick="rateCard('easy')">😊 Easy</button>`;
    container.appendChild(rating);
  }
  // Play automatically
  speak(window._fcItems[flashIdx].bg);
}

function fcNavW(dir) {
  const items = window._fcItems;
  flashIdx = (flashIdx + dir + items.length) % items.length;
  flashFlipped = false;
  showFlashcard(items);
}

function rateCard(rating) {
  const item = window._fcItems[flashIdx];
  markLearned(item.bg);
  fcNavW(1);
}

// QUIZ
// ══════════════════════════════════════════════════════════════════════════════

function renderQuiz() {
  const items = getModuleItems();
  if (items.length < 4) {
    document.getElementById('mode-content').innerHTML = '<p style="color:var(--text3);text-align:center;padding:40px">Need at least 4 phrases for quiz.</p>';
    return;
  }
  quizItems = shuffle([...items]).slice(0, Math.min(15, items.length));
  quizIdx = 0;
  quizScore = 0;
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const el = document.getElementById('mode-content');
  if (quizIdx >= quizItems.length) { renderQuizComplete(); return; }

  const item = quizItems[quizIdx];
  const all = getModuleItems();
  const wrong = shuffle(all.filter(x => x.bg !== item.bg)).slice(0,3);
  const opts = shuffle([item, ...wrong]);
  const qType = quizIdx % 3; // 0=EN→BG, 1=BG→EN, 2=audio→BG

  let qHTML = '';
  if (qType === 0) {
    qHTML = `<div class="quiz-question-label">Choose the Bulgarian translation</div>
             <div class="quiz-question">${item.en}</div>`;
  } else if (qType === 1) {
    qHTML = `<div class="quiz-question-label">What does this mean?</div>
             <div class="quiz-question big">${item.bg}</div>
             <div class="quiz-sub">${item.tr}</div>`;
  } else {
    qHTML = `<div class="quiz-question-label">Listen and choose the phrase you hear</div>
             <button class="quiz-audio-btn" onclick="speak('${escStr(item.bg)}')">▶ Play audio</button>`;
    setTimeout(() => speak(item.bg), 300);
  }

  let optsHTML = opts.map(opt => {
    const label = qType === 0 ? `${opt.bg}<br><em style="font-size:0.85rem;color:var(--text3)">${opt.tr}</em>` : (qType === 1 ? opt.en : `${opt.bg}<br><em style="font-size:0.85rem;color:var(--text3)">${opt.tr}</em>`);
    return `<button class="opt-btn" onclick="answerQuiz('${escStr(opt.bg)}','${escStr(item.bg)}')">${label}</button>`;
  }).join('');

  el.innerHTML = `
    <div class="quiz-container">
      <div class="quiz-progress-row">
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${(quizIdx/quizItems.length)*100}%"></div></div>
        <div class="quiz-score">Score: ${quizScore}/${quizIdx}</div>
      </div>
      <div class="quiz-card">
        ${qHTML}
        <div class="quiz-options">${optsHTML}</div>
        <div id="quiz-feedback"></div>
      </div>
    </div>`;
}

function answerQuiz(chosen, correct) {
  if (quizAnswered) return;
  quizAnswered = true;
  const isCorrect = chosen === correct;
  if (isCorrect) quizScore++;

  const btns = document.querySelectorAll('.opt-btn');
  btns.forEach(b => {
    b.disabled = true;
    const onclick = b.getAttribute('onclick') || '';
    if (onclick.includes(escStr(correct))) b.classList.add('correct');
    if (!isCorrect && onclick.includes(escStr(chosen))) b.classList.add('wrong');
  });

  if (isCorrect) markLearned(correct);
  quizAnswered = true;

  const feedback = document.getElementById('quiz-feedback');
  const correctItem = getModuleItems().find(x => x.bg === correct);
  feedback.className = 'quiz-feedback ' + (isCorrect ? 'correct' : 'wrong');
  feedback.innerHTML = isCorrect
    ? `✓ Correct! <strong>${correctItem?.bg}</strong> = ${correctItem?.en}`
    : `✗ It was: <strong>${correctItem?.bg}</strong> (${correctItem?.tr}) = ${correctItem?.en}`;

  const nextBtn = document.createElement('button');
  nextBtn.className = 'quiz-next-btn';
  nextBtn.textContent = quizIdx+1 >= quizItems.length ? 'See Results →' : 'Next →';
  nextBtn.onclick = () => { quizIdx++; renderQuizQuestion(); };
  feedback.after(nextBtn);
}



function renderQuizComplete() {
  const el = document.getElementById('mode-content');
  const pct = Math.round((quizScore/quizItems.length)*100);
  const emoji = pct >= 80 ? '🎉' : pct >= 60 ? '👍' : '💪';
  el.innerHTML = `
    <div class="quiz-complete">
      <div class="quiz-complete-emoji">${emoji}</div>
      <div class="quiz-complete-score">${quizScore}/${quizItems.length}</div>
      <h2>${pct}% Correct</h2>
      <p>${pct >= 80 ? 'Excellent! You\'re really getting it.' : pct >= 60 ? 'Good progress! Keep practising.' : 'Keep going — repetition is the key!'}</p>
      <button class="quiz-next-btn" onclick="renderQuiz()" style="max-width:280px;margin:0 auto">Try Again</button>
    </div>`;
}

function shuffle(arr) { return [...arr].sort(() => Math.random()-0.5); }

// ══════════════════════════════════════════════════════════════════════════════
// ALPHABET
// ══════════════════════════════════════════════════════════════════════════════

function renderAlphabet() {
  const el = document.getElementById('alphabet-content');
  let html = `
    <div class="tips-box">
      <strong>Reading tip:</strong> Bulgarian Cyrillic has 30 letters. Many look like Latin letters but sound different — В = V, Р = R, Н = N, С = S. Tap any letter to hear its sound.
    </div>
    <div class="alphabet-grid">`;
  ALPHABET.forEach(l => {
    html += `
      <div class="letter-card" onclick="speak('${l.upper}')">
        <div class="letter-bg">${l.upper}</div>
        <div class="letter-sm">${l.lower}</div>
        <div class="letter-sound">${l.sound}</div>
        <div class="letter-example">${l.example}</div>
      </div>`;
  });
  html += `</div>`;
  el.innerHTML = html;
}

// ══════════════════════════════════════════════════════════════════════════════
// DIALOGUES
// ══════════════════════════════════════════════════════════════════════════════

function renderDialogues() {
  const el = document.getElementById('dialogues-content');
  let html = `
    <div class="tips-box">
      <strong>How to use:</strong> Read each line aloud — your lines are highlighted in blue. Tap ▶ to hear any line. Use "Play All" to listen to the full conversation at natural speed.
    </div>`;

  DIALOGUES.forEach((dlg, di) => {
    const linesHTML = dlg.lines.map((line, li) => `
      <div class="dialogue-line ${line.you ? 'you' : ''}">
        <div>
          <div class="speaker-label">${line.speaker}</div>
          <div class="dialogue-bubble">
            <div class="bubble-cyrillic">${line.bg}</div>
            <div class="bubble-translit">${line.tr}</div>
            <div class="bubble-english">${line.en}</div>
            <button class="bubble-audio" onclick="speak('${escStr(line.bg)}')">▶ Play</button>
          </div>
        </div>
      </div>`).join('');

    html += `
      <div class="dialogue-scenario" id="dlg-${di}">
        <div class="dialogue-header" onclick="toggleDialogue(${di})">
          <div class="dialogue-icon">${dlg.icon}</div>
          <div>
            <div class="dialogue-title">${dlg.title}</div>
            <div class="dialogue-sub">${dlg.sub}</div>
          </div>
          <div class="dialogue-chevron">▼</div>
        </div>
        <div class="dialogue-body">
          <button class="dialogue-play-all" onclick="playDialogue(${di})">▶ Play full conversation</button>
          ${linesHTML}
        </div>
      </div>`;
  });

  el.innerHTML = html;
}

function toggleDialogue(idx) {
  const el = document.getElementById('dlg-'+idx);
  el.classList.toggle('open');
}

function playDialogue(idx) {
  const dlg = DIALOGUES[idx];
  speakSequence(dlg.lines.map(l => l.bg), 800);
}
